version: '3.8'

services:
  # 1. Your Node.js Application
  app:
    build: .
    container_name: character_guesser_app
    ports:
      - "80:3000"
    environment:
      # These override your .env file inside the container
      - PORT=3000
      - MONGO_URI=mongodb://mongo:27017/characterguesser
      - JWT_SECRET=super_secret_access_key
      - REFRESH_SECRET=super_secret_refresh_key_456
    depends_on:
      - mongo
    restart: unless-stopped

  # 2. The MongoDB Database
  mongo:
    image: mongo:latest
    container_name: character_guesser_db
    ports:
      - "27017:27017"
    volumes:
      # Saves your database state (Users, Characters) permanently
      - mongo_data:/data/db 
    restart: unless-stopped

# Declare the permanent database volume
volumes:
  mongo_data: